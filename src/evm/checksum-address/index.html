<body>
<main>
  <a class="back" href="../">← EVM</a>
  <h1>✅ Checksum Address</h1>
  <p class="lead">Validate an address and convert it to its EIP-55 checksummed form. Mixed-case letters encode a checksum that catches typos.</p>

  <div class="panel">
    <div class="field">
      <label for="addr" class="muted">Address</label>
      <input id="addr" class="mono" spellcheck="false" autocomplete="off" placeholder="0x…" value="0x5aaeb6053f3e94c9b9a09f33669435e7ef1beaed">
    </div>
    <div class="row"><button type="button" id="example">Example: EIP-55 address</button></div>
    <p class="error" id="err" hidden></p>
    <p class="status" id="status" hidden></p>
    <div class="out" id="out"></div>
  </div>
</main>
