<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keccak-256</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%23%EF%B8%8F%E2%83%A3</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/evm.css">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="../../assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← EVM</a>
  <h1>#️⃣ Keccak-256</h1>
  <p class="lead">Hash text or hex bytes with Keccak-256, the hash Ethereum uses. It is not the same as NIST SHA3-256.</p>

  <div class="panel">
    <div class="seg" id="mode">
      <button data-mode="text" aria-pressed="true">Text (UTF-8)</button>
      <button data-mode="hex" aria-pressed="false">Hex bytes</button>
    </div>
    <div class="field">
      <textarea id="input" class="mono" rows="4" spellcheck="false" placeholder="Type or paste input"></textarea>
    </div>
    <div class="row"><button type="button" id="example">Example: transfer(address,uint256)</button></div>
    <p class="error" id="err" hidden></p>
    <div class="out" id="out"></div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 4.4 MB</span></span>
  <a href="https://github.com/ai-pavel/cryptobench">Source on GitHub</a>
</footer>
<script type="module" src="keccak256.js"></script>
</body>
</html>
