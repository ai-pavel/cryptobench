<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Address from Key</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%97%9D%EF%B8%8F</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/evm.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← EVM</a>
  <h1>🗝️ Address from Key</h1>
  <p class="lead">Derive the public key and address of a private key, or the address of a public key.</p>

  <div class="panel">
    <p class="warning">Runs locally in your browser. Don't paste keys that hold real funds.</p>
    <div class="field">
      <label for="key" class="muted">Private key (32 bytes) or public key (33, 64 or 65 bytes)</label>
      <textarea id="key" class="mono" rows="2" spellcheck="false" autocomplete="off" placeholder="0x…"></textarea>
    </div>
    <div class="row"><button type="button" id="example">Example</button><button id="random">Random private key</button></div>
    <p class="error" id="err" hidden></p>
    <div class="out" id="out"></div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 3.8 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module" src="address-from-key.js"></script>
</body>
</html>
