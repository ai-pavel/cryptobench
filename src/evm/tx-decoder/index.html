<body>
<main>
  <a class="back" href="../">← EVM</a>
  <h1>📦 Transaction Decoder</h1>
  <p class="lead">Decode a raw signed transaction (legacy, EIP-2930, EIP-1559, EIP-4844 or EIP-7702) and recover its sender. Paste the hex you'd send with <code>eth_sendRawTransaction</code>.</p>

  <div class="panel">
    <div class="field">
      <textarea id="raw" class="mono" rows="5" spellcheck="false" placeholder="0x02f8…"></textarea>
    </div>
    <div class="row"><button type="button" id="example">Example</button></div>
    <p class="error" id="err" hidden></p>
    <div class="out" id="out"></div>
  </div>
</main>
