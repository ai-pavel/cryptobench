<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Target Bits</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8E%AF</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/btc.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← Bitcoin</a>
  <h1>🎯 Target Bits</h1>
  <p class="lead">Convert between a proof-of-work target and its compact “bits” encoding, and see the difficulty.</p>

  <div class="panel">
    <div class="row example-row"><button type="button" id="example">Example</button></div>
    <div class="seg" id="mode">
      <button data-mode="bits" aria-pressed="true">Bits → target</button>
      <button data-mode="target" aria-pressed="false">Target → bits</button>
    </div>
    <div class="field"><input id="input" class="mono" spellcheck="false" value="0x1d00ffff"></div>
    <p class="error" id="err" hidden></p>
    <div class="out" id="out"></div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 3.9 MB</span></span>

</body>
