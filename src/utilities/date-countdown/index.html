<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Date Countdown</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%85</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← Utilities</a>
  <h1>📅 Date Countdown</h1>
  <p class="lead">Count down to the dates that matter. Your countdowns are saved in this browser.</p>

  <div class="panel">
    <form class="row" id="add">
      <label style="flex:1;min-width:180px">Event <input id="name" placeholder="e.g. Vacation" required></label>
      <label>Date and time <input id="when" type="datetime-local" required></label>
      <button class="primary" style="align-self:flex-end">Add</button>
    </form>
    <div class="list" id="list"></div>
    <p class="muted" id="empty">No countdowns yet.</p>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 3.6 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module" src="date-countdown.js"></script>
</body>
</html>
