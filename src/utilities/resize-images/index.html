<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resize Images</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%90</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    .drop {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      padding: 28px 16px; border: 2px dashed var(--border); border-radius: 12px;
      text-align: center; cursor: pointer; color: var(--muted);
    }
    .drop.over, .drop:hover { border-color: var(--accent); color: var(--text); }
    .drop strong { color: var(--text); }
    .drop input { display: none; }
    .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
    .settings input, .settings select { width: 100%; }
    .settings label[hidden] { display: none; }
    .item .thumb { display: flex; gap: 12px; align-items: center; flex: 1; min-width: 0; }
    .item img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: var(--bg); }
    .item .info { flex: 1; min-width: 0; }
    .item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    a.btn {
      padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px;
      color: inherit; text-decoration: none; white-space: nowrap;
    }
    a.btn:hover { border-color: var(--accent); }
    .smaller { color: #2e8b57; }
    .bigger { color: #c0392b; }
  </style>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← Utilities</a>
  <h1>📐 Resize Images</h1>
  <p class="lead">Scale, convert and compress images. Everything happens on your device.</p>

  <div class="panel">
    <label class="drop" id="drop">
      <input type="file" id="files" accept="image/*" multiple>
      <span style="font-size:32px">🖼️</span>
      <strong>Drop images here or click to choose</strong>
      <span>JPEG, PNG, WebP, GIF, AVIF, HEIC (if your browser can open it)</span>
    </label>

    <div class="settings">
      <label>Resize <select id="mode">
        <option value="fit">Fit within</option>
        <option value="percent">By percentage</option>
        <option value="exact">Exact size</option>
        <option value="none">Keep size</option>
      </select></label>
      <label data-mode="fit exact">Width (px) <input id="w" type="number" min="1" value="1920"></label>
      <label data-mode="fit exact">Height (px) <input id="h" type="number" min="1" value="1920"></label>
      <label data-mode="percent" hidden>Percentage <input id="pct" type="number" min="1" max="1000" value="50"></label>
      <label>Format <select id="format"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></label>
      <label id="qualityLabel"><span>Quality: <span id="qv">85</span>%</span> <input id="quality" type="range" min="10" max="100" value="85"></label>
    </div>
    <p class="muted" id="modeHint"></p>

    <div class="list" id="list"></div>
    <div class="row" id="actions" hidden style="margin-top:16px">
      <button class="primary" id="zip">Download all (ZIP)</button>
      <button id="clear">Clear</button>
      <span class="muted" id="total"></span>
    </div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 3.4 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module" src="resize-images.js"></script>
</body>
</html>
