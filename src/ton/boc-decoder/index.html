<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOC Decoder</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%A7%B1</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/ui.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← TON</a>
  <h1>🧱 BOC Decoder</h1>

  <p class="lead">Decode a bag of cells (BOC) into its cell tree with bits, references and hashes.</p>

  <div class="panel">
    <label class="field"><span>BOC (hex or base64)</span><textarea id="in" rows="5" class="mono" spellcheck="false" autocomplete="off" placeholder="te6cck…"></textarea></label>
    <div class="row" style="margin-top:12px">
      <button class="primary" type="button" id="go">Decode</button>
      <button type="button" id="example">Example</button>
      <button type="button" id="expand" hidden>Expand all</button>
      <button type="button" id="collapse" hidden>Collapse all</button>
    </div>
    <p class="error" id="err" hidden></p>
    <div class="kv" id="summary"></div>
    <div id="tree"></div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 4.0 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module" src="boc-decoder.js"></script>
</body>
</html>
