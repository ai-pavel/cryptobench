<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8C%80</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">

<body>
<main>
  <a class="back" href="../">← Polkadot</a>
  <h1>🌀 Hasher</h1>
  <p class="lead">Hash text or hex with the functions Substrate uses: Blake2, xxHash (Twox), Keccak and SHA-256, plus the Concat variants used in storage keys.</p>
<!-- tool -->
  <div class="panel">
    <div class="row">
      <label class="check"><input type="radio" name="enc" value="text" checked> Text (UTF-8)</label>
      <label class="check"><input type="radio" name="enc" value="hex"> Hex</label>
    </div>
    <label class="field">Input
      <textarea id="in" class="wide" rows="3" spellcheck="false">Balances</textarea>
    </label>
    <div class="row"><button type="button" id="example">Example: "System"</button></div>
    <p class="error" id="err" hidden></p>
    <div id="out"></div>
  </div>
<script type="module" src="hasher.js"></script>
<!-- /tool -->
</main>
<footer class="site-footer">
