<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON Diff</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%86%9A</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
  <!-- dev:head -->
  <link rel="stylesheet" href="../lib/dev.css">
  <style>
    td.add { color: var(--ok); } td.rem { color: var(--bad); } td.chg { color: var(--warn); }
    .error { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  </style>
  <!-- /dev:head -->
</head>
<body>
<main>
  <a class="back" href="../">← Developer</a>
  <h1>🆚 JSON Diff</h1>
  <p class="lead">Compare two JSON documents.</p>
  <!-- dev:body -->
  <div class="panel">
    <div class="grid2">
      <div class="field"><span>Original JSON</span><textarea id="a" class="mono" rows="10" spellcheck="false">{"name":"Alice","age":30,"roles":["admin","dev"],"address":{"city":"Lisbon"},"active":true}</textarea></div>
      <div class="field"><span>Changed JSON</span><textarea id="b" class="mono" rows="10" spellcheck="false">{"name":"Alice","age":31,"roles":["dev","admin","ops"],"address":{"city":"Porto","zip":"4000"}}</textarea></div>
    </div>
    <div class="toolbar"><label><input type="checkbox" id="unordered"> Ignore array order</label></div>
    <p class="error" id="err" hidden></p>
    <p class="status" id="stats"></p>
    <div class="scroll"><table class="data" id="out"></table></div>
  </div>
  <script type="module" src="json-diff.js"></script>
  <!-- /dev:body -->
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 4.1 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
</body>
</html>
