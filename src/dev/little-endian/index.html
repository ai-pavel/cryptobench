<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Endian</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%94%84</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
  <!-- dev:head -->
  <link rel="stylesheet" href="../lib/dev.css">
  <!-- /dev:head -->
</head>
<body>
<main>
  <a class="back" href="../">← Developer</a>
  <h1>🔄 Little Endian</h1>
  <p class="lead">Convert a number between big-endian and little-endian bytes.</p>
  <!-- dev:body -->
  <div class="panel">
    <div class="seg" id="mode">
      <button data-mode="num" aria-pressed="true">Number → bytes</button>
      <button data-mode="bytes" aria-pressed="false">Bytes → number</button>
    </div>
    <div class="field">
      <span id="inLabel">Number (decimal, or 0x / 0b / 0o prefix)</span>
      <input id="in" class="mono" value="305419896" autocomplete="off" spellcheck="false">
    </div>
    <div class="toolbar">
      <label>Width <select id="bits">
        <option value="8">8-bit</option><option value="16">16-bit</option><option value="32" selected>32-bit</option>
        <option value="64">64-bit</option><option value="128">128-bit</option><option value="256">256-bit</option>
      </select></label>
      <label><input type="checkbox" id="signed"> Signed</label>
      <label id="orderWrap" hidden>Input byte order <select id="order"><option value="le">Little-endian</option><option value="be">Big-endian</option></select></label>
    </div>
    <p class="error" id="err" hidden></p>
    <div class="out" id="out"></div>
  </div>
  <script type="module" src="little-endian.js"></script>
  <!-- /dev:body -->
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 3.1 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
</body>
</html>
