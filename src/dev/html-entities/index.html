<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Entities</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8F%B7%EF%B8%8F</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">

  <link rel="stylesheet" href="../lib/dev.css">

<body>
<main>
  <a class="back" href="../">← Developer</a>
  <h1>🏷️ HTML Entities</h1>
  <p class="lead">Escape and unescape HTML entities.</p>
  <!-- dev:body -->
  <div class="panel">
    <div class="seg" id="mode">
      <button data-mode="escape" aria-pressed="true">Escape</button>
      <button data-mode="unescape" aria-pressed="false">Unescape</button>
    </div>
    <div class="field"><span>Input</span><textarea id="in" class="mono" rows="6" spellcheck="false"><a href="/?q=1&x=2">Café “quotes” © 2024 — ok</a></textarea></div>
    <div class="toolbar" id="opts">
      <label>Escape <select id="scope">
        <option value="min">Only &amp; &lt; &gt; " '</option>
        <option value="nonascii">… plus all non-ASCII characters</option>
        <option value="all">Every character except letters, digits and spaces</option>
      </select></label>
      <label>Prefer <select id="style"><option value="named">Named entities (&amp;copy;)</option><option value="dec">Decimal (&amp;#169;)</option><option value="hex">Hex (&amp;#xA9;)</option></select></label>
    </div>
    <div class="field"><span>Output</span><textarea id="outText" class="mono" rows="6" readonly></textarea></div>
    <div class="row"><button data-copy-from="outText">Copy</button><button id="swap">Use output as input</button></div>
  </div>
  <script type="module" src="html-entities.js"></script>
  <!-- /dev:body -->
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 4.2 MB</span></span>

</body>
</html>
