<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timestamp Converter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%8C%9B</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="../../assets/pwa.js" defer></script>
  <!-- dev:head -->
  <link rel="stylesheet" href="../lib/dev.css">
  <!-- /dev:head -->
</head>
<body>
<main>
  <a class="back" href="../">← Developer</a>
  <h1>⌛ Timestamp Converter</h1>
  <p class="lead">Convert Unix timestamps and dates.</p>
  <!-- dev:body -->
  <div class="panel">
    <div class="field"><span>Unix timestamp or date (e.g. 1700000000, 1700000000123, 2024-05-01T12:00:00Z)</span>
      <div class="row"><input id="in" class="mono" style="flex:1;min-width:0" autocomplete="off" spellcheck="false"><button id="now" class="primary">Now</button></div>
    </div>
    <div class="toolbar">
      <label>Unit <select id="unit"><option value="auto">Auto-detect</option><option value="s">Seconds</option><option value="ms">Milliseconds</option><option value="us">Microseconds</option><option value="ns">Nanoseconds</option></select></label>
      <label>Time zone <select id="tz" style="max-width:220px"></select></label>
    </div>
    <p class="error" id="err" hidden></p>
    <p class="muted" id="detected"></p>
    <div class="out" id="out"></div>
  </div>
  <script type="module" src="timestamp.js"></script>
  <!-- /dev:body -->
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 4.4 MB</span></span>
  <a href="https://github.com/ai-pavel/cryptobench">Source on GitHub</a>
</footer>
</body>
</html>
