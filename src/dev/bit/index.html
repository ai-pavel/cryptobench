<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bit</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%92%A1</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
  <!-- dev:head -->
  <link rel="stylesheet" href="../lib/dev.css">
  <style>
    .bitgrid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; margin: 12px 0; }
    .bitgrid .byte-label { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: 6px; }
    .bitgrid button { padding: 6px 0; font: 600 16px ui-monospace, Menlo, monospace; display: flex; flex-direction: column; align-items: center; }
    .bitgrid button small { font-size: 10px; font-weight: 400; color: var(--muted); }
    .bitgrid button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .bitgrid button.on small { color: inherit; opacity: .8; }
  </style>
  <!-- /dev:head -->
</head>
<body>
<main>
  <a class="back" href="../">← Developer</a>
  <h1>💡 Bit</h1>
  <p class="lead">Flip bits in an interactive editor.</p>
  <!-- dev:body -->
  <div class="panel">
    <div class="toolbar">
      <label>Width <select id="bits"><option value="8">8-bit</option><option value="16">16-bit</option><option value="32" selected>32-bit</option><option value="64">64-bit</option></select></label>
      <label><input type="checkbox" id="signed"> Signed</label>
    </div>
    <div class="field"><span>Value (decimal, 0x, 0b, 0o)</span><input id="in" class="mono" value="0xdeadbeef" autocomplete="off"></div>
    <div class="toolbar">
      <button id="shl">« Shift left</button><button id="shr">Shift right »</button><button id="not">Invert</button><button id="clear">Clear</button><button id="fill">All ones</button>
    </div>
    <p class="error" id="err" hidden></p>
    <div class="bitgrid" id="grid"></div>
    <div class="out" id="out"></div>
  </div>
  <script type="module" src="bit.js"></script>
  <!-- /dev:body -->
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 3.1 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
</body>
</html>
