<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Parser</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%94%97</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
  <!-- dev:head -->
  <link rel="stylesheet" href="../lib/dev.css">
  <style>
    .params td input { width: 100%; }
    .params td:last-child { width: 1%; }
    h2 { margin-top: 20px; }
  </style>
  <!-- /dev:head -->
</head>
<body>
<main>
  <a class="back" href="../">← Developer</a>
  <h1>🔗 URL Parser</h1>
  <p class="lead">Split a URL and edit its query parameters.</p>
  <!-- dev:body -->
  <div class="panel">
    <div class="field"><span>URL</span>
      <textarea id="url" class="mono" rows="3" spellcheck="false">https://user:pass@example.com:8080/path/to/page.html?q=hello%20world&lang=en&tag=a&tag=b#section-2</textarea></div>
    <p class="error" id="err" hidden></p>
    <div class="out" id="out"></div>
    <div id="paramsBox" hidden>
      <h2>Query parameters</h2>
      <div class="scroll"><table class="data params"><thead><tr><th>Name</th><th>Value (decoded)</th><th></th></tr></thead><tbody id="params"></tbody></table></div>
      <div class="row" style="margin-top:8px"><button id="add">Add parameter</button></div>
    </div>
    <h2>Encode / decode a component</h2>
    <div class="field"><textarea id="comp" class="mono" rows="2" spellcheck="false">a b&c=d/é</textarea></div>
    <div class="out" id="compOut"></div>
  </div>
  <script type="module" src="url-parser.js"></script>
  <!-- /dev:body -->
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 3.2 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
</body>
</html>
